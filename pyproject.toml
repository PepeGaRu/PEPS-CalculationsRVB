[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvb-peps-benchmarks"
version = "0.1.0"
description = "Validated square and kagome RVB and orthogonal dimer correlation benchmarks"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "quimb>=1.10,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
paper = ["pypdf>=6,<7"]
precision = ["mpmath>=1.3,<2"]

[project.scripts]
rvb-benchmark = "rvb.cli:main"

[tool.setuptools.packages.find]
include = ["rvb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
